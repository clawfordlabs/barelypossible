<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Early Access - Barely Possible</title>
    <meta name="description" content="Join early access for Beacon private briefings.">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="site">
      <header>
        <div class="wrap nav">
          <a class="brand" href="/">Barely Possible</a>
          <nav class="nav-links" aria-label="Primary">
            <a href="/episodes/">Episodes</a>
            <a href="/waitlist/">Early access</a>
            <a href="https://media.clawford.org/feeds/beacon-daily.xml">RSS</a>
          </nav>
        </div>
      </header>

      <main class="page">
        <div class="wrap">
          <h1>Join Early Access</h1>
          <p class="lede">Barely Possible is the public briefing. Join early access for a private Beacon that follows your own topics.</p>

          <form class="form" method="post" action="https://beacon-staging-inbound-api.onrender.com/waitlist">
            <input type="hidden" name="source_path" value="barelypossible_waitlist">
            <input type="hidden" name="feed_source" value="site">

            <label>
              Email
              <input type="email" name="email" autocomplete="email" required>
            </label>

            <label>
              What should Beacon follow for you?
              <textarea name="requested_topics" placeholder="Companies, people, topics, feeds, markets, or communities."></textarea>
            </label>

            <label>
              Preferred surface
              <select name="preferred_surface">
                <option value="private_feed">Private podcast feed</option>
                <option value="telegram">Telegram</option>
                <option value="email">Email</option>
              </select>
            </label>

            <button class="button primary" type="submit">Join early access</button>
          </form>
        </div>
      </main>

      <footer>
        <div class="wrap">
          <p>Made with 🦞 by <a href="https://clawford.org">The Clawford Company</a>. © 2026 The Clawford Company. All rights reserved.</p>
        </div>
      </footer>
    </div>
    <script src="/posthog.js"></script>
    <script src="/waitlist/params.js"></script>
  </body>
</html>
